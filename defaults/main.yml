---
#______________________________________________
# defaults file for ansible-role-laniakea-tools

# Github repository containing flavor
#galaxy_flavors_url: 'https://github.com/pmandreoli/Galaxy-flavors-recipes.git'
galaxy_flavors_url: 'https://github.com/Laniakea-elixir-it/Galaxy-flavours.git'

# Directory to clone it in
galaxy_flavors_dir: '{{ galaxy_tools_base_dir }}/Galaxy-flavours'

# Repos branch
galaxy_flavors_tag: 'test'

# Laniakea galaxy flavor
#laniakea_galaxy_flavor: galaxy-testing
galaxy_flavor: galaxy-minimal

# Galaxy user
laniakea_galaxy_user: {name: galaxy, shell: /bin/bash, uid: 5001}

# Galaxy nginx prefix
galaxy_port: 80
galaxy_prefix: "/galaxy/" 

#______________________________________
# Galaxy bootstrap administrator creds
galaxy_bootstrap_user: "galaxy_bootstrap_user"
galaxy_bootstrap_password: "galaxy_bootstrap_password"
GALAXY_ADMIN_API_KEY: "changeit" # keep the variable name the same of the main role.
galaxy_bootstrap_email: "galaxy_bootstrap@server.com"

#______________________________________
# Galaxy path

# Directory used to store galaxy flavors
galaxy_tools_base_dir: /data

# Galaxy config dir
laniakea_galaxy_config_dir: /home/galaxy/galaxy/config

# Galaxy dir that contain run.sh script
laniakea_galaxy_server_dir:  /home/galaxy/galaxy/server 

# Path to galaxy virtualenv
laniakea_galaxy_venv_dir: /home/galaxy/galaxy/venv

# Path to galaxy config file
laniakea_galaxy_config_file: /home/galaxy/galaxy/config/galaxy.yml

# Debug variable
role_debug: false
galaxy_tools_ignore_errors: false
